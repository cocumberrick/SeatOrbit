name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}
          enablement: ${{ secrets.PAGES_ENABLEMENT_TOKEN != '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_TICKETMASTER_API_KEY: ${{ secrets.VITE_TICKETMASTER_API_KEY }}
          VITE_TICKETMASTER_EVENT_ID: ${{ vars.VITE_TICKETMASTER_EVENT_ID }}
          VITE_TICKETMASTER_VENUE_ID: ${{ vars.VITE_TICKETMASTER_VENUE_ID }}
          VITE_TICKETMASTER_VENUE_NAME: ${{ vars.VITE_TICKETMASTER_VENUE_NAME }}
          VITE_TICKETMASTER_URL: ${{ vars.VITE_TICKETMASTER_URL }}
          VITE_STRIPE_FAN_FLAG_PAYMENT_URL: ${{ vars.VITE_STRIPE_FAN_FLAG_PAYMENT_URL }}

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
